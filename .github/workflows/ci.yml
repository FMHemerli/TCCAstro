name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC -- runs the slow suite (see below)

jobs:
  fast-tests:
    name: fast tests (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and test dependencies
        run: |
          pip install -e .
          pip install pytest numpy

      - name: Run fast test suite (slow tests deselected; gpu tests skip loudly on this CPU runner)
        run: |
          python -m pytest -m "not slow" -v --durations=25

  slow-tests:
    name: slow tests (CPU, full physics suite)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Not run on every push/PR: the full RUN_COLLAPSE, RUN_CONVERGENCE and INV-7 amplitude
    # sweeps are on the order of tens of minutes of O(N^2) work on CPU (see the module
    # docstrings of tests/test_*_slow.py). Runs on manual dispatch and on the weekly schedule
    # only, so the per-commit signal in fast-tests stays fast and honest.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and test dependencies
        run: |
          pip install -e .
          pip install pytest numpy

      - name: Run slow test suite
        run: |
          python -m pytest -m slow -v --durations=25
