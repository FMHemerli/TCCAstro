[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nbody"
version = "0.1.0"
description = "TCCAstro N-body numerical core"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.9",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]
