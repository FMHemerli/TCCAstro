[pytest]
testpaths = tests
markers =
    slow: long-running tests (full RUN_COLLAPSE, full RUN_CONVERGENCE ladder, full INV-7 amplitude table). Deselect with '-m "not slow"'.
    gpu: requires an actual CUDA device. Skips loudly (with reason) when none is present; never passes vacuously.
    golden: depends on a committed reference/golden data file under data/. Skips loudly when the file is absent.
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
